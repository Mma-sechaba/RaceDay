name: Part 1 Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-part1:
    name: Validate Part 1 Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required folders
        shell: bash
        run: |
          set -e

          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing."
            exit 1
          fi

          if [ ! -d ".github/workflows" ]; then
            echo "ERROR: .github/workflows folder is missing."
            exit 1
          fi

          echo "Required folders are present."

      - name: Check required Part 1 files
        shell: bash
        run: |
          set -e

          test -f "README.md" || {
            echo "ERROR: README.md is missing."
            exit 1
          }

          test -f "docs/API-Endpoint-Plan.md" || {
            echo "ERROR: docs/API-Endpoint-Plan.md is missing."
            exit 1
          }

          test -f "docs/database.sql" || {
            echo "ERROR: docs/database.sql is missing."
            exit 1
          }

          if [ -f "docs/ERD.pdf" ] || [ -f "docs/ERD.png" ]; then
            echo "ERD file found."
          else
            echo "ERROR: docs/ERD.pdf or docs/ERD.png is missing."
            exit 1
          fi

          echo "All required Part 1 files are present."

      - name: Validate endpoint plan headings
        shell: bash
        run: |
          set -e

          PLAN="docs/API-Endpoint-Plan.md"

          grep -qi "HTTP Method" "$PLAN" || {
            echo "ERROR: HTTP Method column was not found in the endpoint plan."
            exit 1
          }

          grep -qi "Route" "$PLAN" || {
            echo "ERROR: Route column was not found in the endpoint plan."
            exit 1
          }

          grep -qi "Description" "$PLAN" || {
            echo "ERROR: Description column was not found in the endpoint plan."
            exit 1
          }

          grep -qi "Role" "$PLAN" || {
            echo "ERROR: Role column was not found in the endpoint plan."
            exit 1
          }

          grep -qi "Request Body" "$PLAN" || {
            echo "ERROR: Request Body column was not found in the endpoint plan."
            exit 1
          }

          grep -qi "Expected Response" "$PLAN" || {
            echo "ERROR: Expected Response column was not found in the endpoint plan."
            exit 1
          }

          echo "Endpoint plan contains the required columns."

      - name: Validate SQL script
        shell: bash
        run: |
          set -e

          SQL="docs/database.sql"

          grep -qi "CREATE TABLE" "$SQL" || {
            echo "ERROR: No CREATE TABLE statement found in database.sql."
            exit 1
          }

          grep -qi "INSERT INTO" "$SQL" || {
            echo "ERROR: No INSERT INTO statement found in database.sql."
            exit 1
          }

          echo "SQL script contains CREATE TABLE and INSERT INTO statements."

      - name: Validation successful
        run: echo "RaceDay Part 1 repository validation completed successfully."
